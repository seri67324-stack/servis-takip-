<!DOCTYPE html>
<html lang="tr"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cihaz Takip</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#060914">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tw.css"><link rel="stylesheet" href="stil.css">
<style>[dir=rtl] body{font-family:Tajawal,system-ui,sans-serif}</style>
</head>
<body class="min-h-screen">
<main class="max-w-md mx-auto p-4 pb-12">
  <div class="flex justify-between items-center pt-1 gap-2">
    <span class="text-xs px-3 py-1 rounded-full bg-indigo-500/15 text-indigo-300 border border-indigo-400/20" id="rolRozet">Müşteri Takip</span>
    <div class="flex gap-1.5 items-center">
      <select id="pbSec" class="chip bg-slate-900/80 cursor-pointer" aria-label="Para Birimi">
        <option value="TRY">₺ TRY</option>
        <option value="USD">$ USD</option>
        <option value="SYP">ل.س SYP</option>
      </select>
      <button data-l="tr" class="chip">TR</button>
      <button data-l="ar" class="chip">عربي</button>
    </div>
  </div>
  <header class="text-center py-6 up">
    <div id="logo" class="ibox grad w-14 h-14 mx-auto text-2xl"></div>
    <h1 id="baslik" class="text-2xl font-extrabold mt-3 gt">Cihaz Takip</h1>
    <p id="altbaslik" class="text-slate-400 text-sm mt-1"></p>
  </header>
  <form id="sorgu" class="glass p-4 grid gap-3 up">
    <div>
      <label class="block text-xs text-slate-400 mb-1" id="lblKod">Takip Kodu</label>
      <input id="kod" dir="ltr" class="inp uppercase font-mono" autocomplete="off">
    </div>
    <div>
      <label class="block text-xs text-slate-400 mb-1" id="lblAnahtar">Takip Şifresi</label>
      <input id="anahtar" dir="ltr" maxlength="8" class="inp font-mono" autocomplete="off">
    </div>
    <button id="sbtn" class="btn grad py-3 mt-1"></button>
  </form>
  <p id="hata" class="text-rose-400 text-sm text-center mt-3 hidden"></p>
  <section id="sonuc" class="hidden mt-4 space-y-4"></section>
  <section id="iletisim" class="glass p-5 mt-5 up text-sm"></section>
  <footer class="text-center mt-8 pt-4 border-t border-white/10">
    <a href="admin.html" id="adminGecis" class="text-xs text-slate-500 hover:text-slate-300 transition">Yetkili / Servis Girişi →</a>
  </footer>
</main>
<div id="lb" class="hidden fixed inset-0 bg-black/95 z-50 flex items-center justify-center p-3" dir="ltr">
  <button id="lbp" class="absolute left-2 text-4xl text-white/80 px-3">‹</button>
  <img id="lbimg" class="max-h-full max-w-full rounded-lg">
  <button id="lbn" class="absolute right-2 text-4xl text-white/80 px-3">›</button>
  <button id="lbx" class="absolute top-3 right-4 text-3xl text-white">✕</button>
</div>
<script src="config.js"></script><script src="ayarlar.js"></script><script src="diller.js"></script><script src="takip.js"></script>
</body></html>
