<!DOCTYPE html>
<html lang="tr"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cihaz Takip</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0f172a">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
<main class="max-w-md mx-auto p-4">
  <header class="text-center py-6"><div class="text-4xl">🔧</div><h1 class="text-xl font-bold mt-2">Cihaz Takip Sistemi</h1><p class="text-slate-400 text-sm">Cihazınızın durumunu anlık izleyin</p></header>
  <form id="sorgu" class="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex gap-2">
    <input id="kod" placeholder="Takip kodu (SRV-1234)" class="flex-1 bg-slate-800 rounded-xl px-3 py-3 uppercase outline-none focus:ring-2 ring-indigo-500">
    <button class="bg-indigo-600 hover:bg-indigo-500 rounded-xl px-5 font-semibold">Sorgula</button>
  </form>
  <p id="hata" class="text-rose-400 text-sm text-center mt-3 hidden"></p>
  <section id="sonuc" class="hidden mt-4 space-y-4"></section>
</main>
<div id="lb" class="hidden fixed inset-0 bg-black/90 z-50 flex items-center justify-center p-3"><img id="lbimg" class="max-h-full max-w-full rounded-lg"></div>
<script src="config.js"></script><script src="takip.js"></script>
</body></html>
