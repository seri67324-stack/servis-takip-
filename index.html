<!DOCTYPE html>
<html lang="tr"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cihaz Takip</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#060914">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="stil.css">
<style>[dir=rtl] body{font-family:Tajawal,system-ui,sans-serif}</style>
</head>
<body class="min-h-screen">
<main class="max-w-md mx-auto p-4 pb-10">
  <div class="flex justify-end gap-2 pt-1"><button data-l="tr" class="chip">Türkçe</button><button data-l="ar" class="chip">العربية</button></div>
  <header class="text-center py-6 up"><div id="logo" class="ibox grad w-14 h-14 mx-auto text-2xl"></div><h1 id="baslik" class="text-2xl font-extrabold mt-3 gt">Cihaz Takip</h1><p id="altbaslik" class="text-slate-400 text-sm mt-1"></p></header>
  <form id="sorgu" class="glass p-3 flex gap-2 up">
    <input id="kod" dir="ltr" class="inp uppercase font-mono">
    <button id="sbtn" class="btn grad px-5"></button>
  </form>
  <p id="hata" class="text-rose-400 text-sm text-center mt-3 hidden"></p>
  <section id="sonuc" class="hidden mt-4 space-y-4"></section>
  <section id="iletisim" class="glass p-5 mt-4 up text-sm"></section>
</main>
<div id="lb" class="hidden fixed inset-0 bg-black/95 z-50 flex items-center justify-center p-3" dir="ltr">
  <button id="lbp" class="absolute left-2 text-4xl text-white/80 px-3">‹</button>
  <img id="lbimg" class="max-h-full max-w-full rounded-lg">
  <button id="lbn" class="absolute right-2 text-4xl text-white/80 px-3">›</button>
  <button id="lbx" class="absolute top-3 right-4 text-3xl text-white">✕</button>
</div>
<script src="config.js"></script><script src="ayarlar.js"></script><script src="diller.js"></script><script src="takip.js"></script>
</body></html>
