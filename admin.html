<!DOCTYPE html>
<html lang="tr"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Servis Yönetim Paneli</title><link rel="manifest" href="manifest-admin.json"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#060914">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tw.css"><link rel="stylesheet" href="stil.css?v=13"><style>[dir=rtl] body{font-family:Tajawal,system-ui,sans-serif}</style>
</head>
<body class="min-h-screen">
<div id="giris" class="max-w-sm mx-auto p-6 mt-12 up">
  <div class="flex justify-between items-center gap-2 mb-6">
    <select data-tema-sec class="chip cursor-pointer" onchange="temaUygula(this.value)">
      <option value="gece">Gece</option>
      <option value="okyanus">Okyanus</option>
      <option value="zumrut">Zümrüt</option>
      <option value="aydinlik">Aydınlık</option>
    </select>
    <div class="flex gap-2"><button data-dl="tr" class="chip">Türkçe</button><button data-dl="ar" class="chip">العربية</button></div>
  </div>
  <div class="ibox grad w-16 h-16 mx-auto text-3xl" id="glogo"></div><h1 class="text-2xl font-extrabold text-center my-5 gt" data-i="giris"></h1>
  <form id="girisForm" class="glass p-5 space-y-3">
    <input id="email" type="email" dir="ltr" data-p="email" class="inp" required>
    <input id="sifre" type="password" dir="ltr" data-p="sifre" class="inp" required>
    <button class="btn grad w-full py-3" data-i="girisBtn"></button>
    <p id="girisHata" class="text-rose-400 text-sm text-center"></p>
  </form>
</div>

<div id="panel" class="hidden max-w-4xl mx-auto p-4 pb-12">
  <div class="flex flex-wrap justify-between items-center mb-3 gap-2">
    <div class="flex items-center gap-2.5">
      <div class="ibox grad w-10 h-10 text-lg" id="plogo"></div>
      <h1 class="text-lg font-extrabold gt" data-i="panel"></h1>
    </div>
    <div class="flex gap-1.5 items-center flex-wrap">
      <select id="temaUst" data-tema-sec class="chip cursor-pointer" onchange="temaUygula(this.value)">
        <option value="gece">Gece</option>
        <option value="okyanus">Okyanus</option>
        <option value="zumrut">Zümrüt</option>
        <option value="aydinlik">Aydınlık</option>
      </select>
      <button data-dl="tr" class="chip">TR</button>
      <button data-dl="ar" class="chip">عربي</button>
      <button id="cikis" class="chip" data-i="cikis"></button>
    </div>
  </div>

  <div id="yedekUy" class="hidden mb-3 text-sm rounded-xl px-4 py-3 bg-amber-500/15 text-amber-300"></div>

  <!-- Kompakt Özet Kartları -->
  <div id="kartlar" class="grid grid-cols-2 md:grid-cols-4 gap-2.5 mb-3"></div>

  <!-- Hazır Bekleyen Cihazlar İçin Otomatik Hatırlatma Sırası (Sadece hazır bekleyen varsa görünür) -->
  <details class="glass p-3.5 mb-3 hidden" id="hazirSiraBox" style="border-color:rgba(244,63,94,.35)">
    <summary class="m-menu-ozet font-semibold text-sm text-rose-300">
      <span class="flex items-center gap-2" id="hazirSiraBaslik"></span>
      <span class="m-ok">▼</span>
    </summary>
    <div id="hazirSiraListe" class="mt-3 space-y-2"></div>
  </details>

  <!-- Yeni Cihaz Kaydı -->
  <details class="glass p-3.5 mb-3" id="yeniDet">
    <summary class="m-menu-ozet font-semibold text-sm">
      <span class="flex items-center gap-2"><span class="ibox grad i8">+</span><span data-i="yeniBtn"></span></span>
      <span class="m-ok text-slate-400">▼</span>
    </summary>
    <form id="yeniForm" class="mt-4 grid gap-3 sm:grid-cols-2">
      <input id="n_ad" data-p="ad" class="inp" required>
      <input id="n_tel" type="tel" dir="ltr" data-p="tel" class="inp" required>
      <input id="n_model" data-p="model" class="inp sm:col-span-2" required>
      <input id="n_ucret" type="number" step="0.01" min="0" data-p="ucret" class="inp">
      <select id="n_pb" class="inp"></select>
      <input id="n_on" type="number" step="0.01" min="0" data-p="onOdeme" class="inp sm:col-span-2">
      <div class="sm:col-span-2"><div class="text-sm text-slate-400 mb-2" data-i="arizaSec"></div><div id="n_az"></div></div>
      <textarea id="n_ariza" data-p="not" class="inp sm:col-span-2" rows="2"></textarea>
      <div class="sm:col-span-2"><div class="text-sm text-slate-400 mb-2" data-i="onceF"></div><div id="n_pk"></div></div>
      <button id="n_btn" class="btn grad-g sm:col-span-2 py-3"></button>
    </form>
  </details>

  <!-- Müşteri & Cihaz Listesi (Açılır/Kapanır Menü - Varsayılan kapalı başlar, tıklayınca aşağı açılır) -->
  <details class="glass p-3.5 mb-3" id="musteriMenu">
    <summary class="m-menu-ozet">
      <div class="flex items-center gap-2.5 min-w-0">
        <span class="ibox grad i8 shrink-0" id="mIkon"></span>
        <div class="min-w-0">
          <div class="font-bold text-sm flex items-center gap-2">
            <span data-i="musteriListesi"></span>
            <span id="musteriSayac" class="text-xs px-2 py-0.5 rounded-full bg-indigo-500/25 text-indigo-300 font-mono">0</span>
          </div>
          <div class="text-xs text-slate-400 truncate" data-i="musteriAc"></div>
        </div>
      </div>
      <span class="m-ok text-slate-400 text-sm">▼</span>
    </summary>

    <div class="mt-3 pt-3 border-t border-white/10">
      <div class="bar mb-2">
        <div class="grid grid-cols-2 gap-2 mb-2">
          <input id="ara" data-p="ara" class="inp">
          <select id="sira" class="inp"></select>
        </div>
        <div class="flex gap-2 overflow-x-auto pb-1" id="chips"></div>
      </div>
      <div id="liste" class="space-y-2.5 max-h-[68vh] overflow-y-auto pr-0.5"></div>
    </div>
  </details>

  <!-- Dönemsel Tahsilat Özeti & İstatistikler -->
  <details class="glass p-3.5 mb-3" id="istDet">
    <summary class="m-menu-ozet font-semibold text-sm">
      <span data-i="ist"></span>
      <span class="m-ok text-slate-400">▼</span>
    </summary>
    <div class="mt-4 space-y-4">
      <div class="flex items-center justify-between flex-wrap gap-2">
        <span class="text-xs text-slate-400" data-i="odemeDokumu"></span>
        <div id="pbSec" class="flex gap-1.5"></div>
      </div>
      <div id="donemKartlar" class="grid grid-cols-3 gap-2"></div>
      <div class="grid md:grid-cols-2 gap-3">
        <div class="sub"><div class="font-semibold mb-3 text-sm" data-i="durumDag"></div><div id="donut"></div></div>
        <div class="sub"><div class="font-semibold text-sm" data-i="aylik"></div><div class="text-xs text-slate-400 mb-2" data-i="son6"></div><div id="aylik" dir="ltr"></div></div>
      </div>
      <div class="sub">
        <div class="font-semibold text-sm mb-2" data-i="odemeDokumu"></div>
        <div id="odemeDokumListe" class="space-y-1.5 max-h-60 overflow-y-auto text-xs"></div>
      </div>
    </div>
  </details>

  <!-- Ayarlar, Tema ve Yedek -->
  <details class="glass p-3.5 mb-3">
    <summary class="m-menu-ozet font-semibold text-sm">
      <span data-i="ayarlar"></span>
      <span class="m-ok text-slate-400">▼</span>
    </summary>
    <div class="mt-4 space-y-3">
      <div class="sub">
        <div class="font-semibold text-sm mb-2" data-i="temaSec"></div>
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-2" id="temaKartlar">
          <button type="button" class="chip justify-center py-2" data-tema-sec="gece" onclick="temaUygula('gece')" data-i="temaGece"></button>
          <button type="button" class="chip justify-center py-2" data-tema-sec="okyanus" onclick="temaUygula('okyanus')" data-i="temaOkyanus"></button>
          <button type="button" class="chip justify-center py-2" data-tema-sec="zumrut" onclick="temaUygula('zumrut')" data-i="temaZumrut"></button>
          <button type="button" class="chip justify-center py-2" data-tema-sec="aydinlik" onclick="temaUygula('aydinlik')" data-i="temaAydinlik"></button>
        </div>
      </div>
      <details class="sub"><summary><span data-i="sb"></span> <span class="text-xs text-slate-400" data-i="sbN"></span></summary>
        <form id="ayarForm" class="mt-3 grid gap-3 sm:grid-cols-2">
          <input id="s_adi" data-p="sAdi" class="inp"><input id="s_tel" type="tel" dir="ltr" data-p="sTel" class="inp">
          <input id="s_adres" data-p="sAdres" class="inp sm:col-span-2"><input id="s_saat" data-p="sSaat" class="inp sm:col-span-2">
          <input id="s_harita" dir="ltr" data-p="sHarita" class="inp sm:col-span-2">
          <button type="button" id="s_konum" class="btn ghost sm:col-span-2"></button>
          <button id="s_btn" class="btn grad-g sm:col-span-2 py-3"></button>
        </form>
      </details>
      <div class="sub"><div class="flex flex-wrap gap-2 items-center"><span class="font-semibold flex-1 text-sm" data-i="yedek"></span><button id="y_json" class="btn ghost" data-i="yJson"></button><button id="y_csv" class="btn ghost" data-i="yCsv"></button><button id="y_geri" class="btn ghost" data-i="yGeri"></button><input type="file" id="y_dosya" accept=".json,application/json" class="hidden"></div></div>
      <details id="otoDet" class="sub"><summary data-i="otoYedek"></summary><div id="otoListe" class="mt-3"></div></details>
    </div>
  </details>
</div>
<script src="config.js?v=13"></script><script src="ayarlar.js?v=13"></script><script src="diller.js?v=13"></script><script src="admin.js?v=13"></script>
</body></html>
