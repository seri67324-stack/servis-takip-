<!DOCTYPE html>
<html lang="tr"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Servis Yönetim Paneli</title><link rel="manifest" href="manifest-admin.json"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#060914">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tw.css"><link rel="stylesheet" href="stil.css"><style>[dir=rtl] body{font-family:Tajawal,system-ui,sans-serif}</style>
</head>
<body class="min-h-screen">
<div id="giris" class="max-w-sm mx-auto p-6 mt-12 up">
  <div class="flex justify-end gap-2 mb-6"><button data-dl="tr" class="chip">Türkçe</button><button data-dl="ar" class="chip">العربية</button></div>
  <div class="ibox grad w-16 h-16 mx-auto text-3xl" id="glogo"></div><h1 class="text-2xl font-extrabold text-center my-5 gt" data-i="giris"></h1>
  <form id="girisForm" class="glass p-5 space-y-3">
    <input id="email" type="email" dir="ltr" data-p="email" class="inp" required>
    <input id="sifre" type="password" dir="ltr" data-p="sifre" class="inp" required>
    <button class="btn grad w-full py-3" data-i="girisBtn"></button>
    <p id="girisHata" class="text-rose-400 text-sm text-center"></p>
  </form>
</div>
<div id="panel" class="hidden max-w-4xl mx-auto p-4 pb-12">
  <div class="flex justify-between items-center mb-4 gap-2"><div class="flex items-center gap-3"><div class="ibox grad w-10 h-10 text-lg" id="plogo"></div><h1 class="text-xl font-extrabold gt" data-i="panel"></h1></div>
  <div class="flex gap-2"><button data-dl="tr" class="chip">TR</button><button data-dl="ar" class="chip">عربي</button><button id="cikis" class="chip" data-i="cikis"></button></div></div>
  <div id="kartlar" class="grid grid-cols-2 md:grid-cols-3 gap-3 mb-4"></div>
  <div class="grid md:grid-cols-2 gap-3 mb-4">
    <div class="glass p-5"><div class="font-semibold mb-4" data-i="durumDag"></div><div id="donut"></div></div>
    <div class="glass p-5"><div class="font-semibold mb-1" data-i="aylik"></div><div class="text-xs text-slate-400 mb-2" data-i="son6"></div><div id="aylik" dir="ltr"></div></div>
  </div>
  <details class="glass p-5 mb-4">
    <summary class="font-semibold cursor-pointer"><span data-i="sb"></span> <span class="text-xs text-slate-400 font-normal" data-i="sbN"></span></summary>
    <form id="ayarForm" class="mt-4 grid gap-3 sm:grid-cols-2">
      <input id="s_adi" data-p="sAdi" class="inp"><input id="s_tel" type="tel" dir="ltr" data-p="sTel" class="inp">
      <input id="s_adres" data-p="sAdres" class="inp sm:col-span-2"><input id="s_saat" data-p="sSaat" class="inp sm:col-span-2">
      <input id="s_harita" dir="ltr" data-p="sHarita" class="inp sm:col-span-2">
      <button type="button" id="s_konum" class="btn ghost sm:col-span-2"></button>
      <button id="s_btn" class="btn grad-g sm:col-span-2 py-3"></button>
    </form>
  </details>
  <details class="glass p-5 mb-4" open>
    <summary class="font-semibold cursor-pointer" data-i="yeni"></summary>
    <form id="yeniForm" class="mt-4 grid gap-3 sm:grid-cols-2">
      <input id="n_ad" data-p="ad" class="inp" required><input id="n_tel" type="tel" dir="ltr" data-p="tel" class="inp" required>
      <input id="n_model" data-p="model" class="inp" required><input id="n_ucret" type="number" step="0.01" data-p="ucret" class="inp"><input id="n_on" type="number" step="0.01" min="0" data-p="onOdeme" class="inp sm:col-span-2">
      <div class="sm:col-span-2"><div class="text-sm text-slate-400 mb-2" data-i="arizaSec"></div><div id="n_az"></div></div>
      <textarea id="n_ariza" data-p="not" class="inp sm:col-span-2" rows="2"></textarea>
      <div class="sm:col-span-2"><div class="text-sm text-slate-400 mb-2" data-i="onceF"></div><div id="n_pk"></div></div>
      <button id="n_btn" class="btn grad-g sm:col-span-2 py-3"></button>
    </form>
  </details>
  <div id="yedekUy" class="hidden mb-3 text-sm rounded-xl px-4 py-3 bg-amber-500/15 text-amber-300"></div>
  <div class="glass p-4 mb-4 flex flex-wrap gap-2 items-center"><span class="font-semibold flex-1" data-i="yedek"></span><button id="y_json" class="btn ghost" data-i="yJson"></button><button id="y_csv" class="btn ghost" data-i="yCsv"></button><button id="y_geri" class="btn ghost" data-i="yGeri"></button><input type="file" id="y_dosya" accept=".json,application/json" class="hidden"></div>
  <details id="otoDet" class="glass p-4 mb-4"><summary class="font-semibold cursor-pointer" data-i="otoYedek"></summary><div id="otoListe" class="mt-3"></div></details>
  <input id="ara" data-p="ara" class="inp mb-3">
  <div class="flex gap-2 overflow-x-auto pb-2 mb-2" id="chips"></div>
  <select id="sira" class="inp mb-3"></select>
  <div id="liste" class="space-y-3"></div>
</div>
<script src="config.js"></script><script src="ayarlar.js"></script><script src="diller.js"></script><script src="admin.js"></script>
</body></html>
