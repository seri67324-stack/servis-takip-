name: keepalive
on:
  schedule:
    - cron: '0 6 */3 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Supabase uyanık tut
        run: |
          URL=$(grep -oP "SUPABASE_URL\s*=\s*'\K[^']+" config.js)
          KEY=$(grep -oP "SUPABASE_ANON_KEY\s*=\s*'\K[^']+" config.js)
          curl -fsS "$URL/rest/v1/ayarlar?select=sahip_id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY"
          
